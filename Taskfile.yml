# CLI tasks. `task --list` shows them; run from cli/.
#
# Releases follow semver.org: vMAJOR.MINOR.PATCH, and while the major
# version is 0 a breaking change bumps the minor version. Pushing the tag
# is the release: the Release workflow (.github/workflows/release.yml)
# checks, tests, scans, builds, signs, attests and publishes it. RELEASING.md
# has the whole process. To release:
#   1. Publish the SDK release the CLI needs (in the SDK repo: task
#      release VERSION=...), then GOWORK=off go get github.com/deepsecret-io/deepsecret-go@...
#      and GOWORK=off go mod tidy, and commit and push.
#   2. From a clean main that is pushed: task release VERSION=v0.1.0.
#      It runs the release checks, the security gate and a full build of
#      every platform here first, then tags HEAD and pushes the tag.
version: '3'

# Tasks build with the SDK version go.mod requires, never a local ../sdk
# through a go.work, so what they build and scan is what a release ships.
# The one exception is `task build`, a dev build. Plain go commands still
# use a go.work.
env:
  GOWORK: 'off'

vars:
  BINARY: secret
  DIST: dist
  SDK: github.com/deepsecret-io/deepsecret-go
  # A release version, vMAJOR.MINOR.PATCH (semver.org). Builds that are
  # not a release say "dev".
  SEMVER: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
  # Release tools for `task release-build` and `task release-snapshot`
  # (platforms and archives are in .goreleaser.yaml), installed into TOOLS.
  # Pinned and checked against the Go checksum database like the scanners
  # below, and the Release workflow uses these same versions.
  GORELEASER: github.com/goreleaser/goreleaser/v2@v2.20.0
  SYFT: github.com/anchore/syft/cmd/syft@v1.57.0
  TOOLS: .tools
  # Scanners for `task security`, pinned and checked against the Go
  # checksum database. Dependabot does not see them; bump them by hand.
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.9.0
  GOSEC: github.com/securego/gosec/v2/cmd/gosec@v2.30.0
  OSV_SCANNER: github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
  GITLEAKS: github.com/zricethezav/gitleaks/v8@v8.30.1
  # Dependency licenses allowed without review. Reviewed exceptions, each
  # with a reason, live in licenses.toml.
  LICENSES: Apache-2.0,BSD-2-Clause,BSD-3-Clause,0BSD,MIT,ISC
  REPORTS: reports

tasks:
  build:
    desc: Build a dev CLI for this machine into dist/, with the SDK from ./go.work when there is one
    # A dev build may use the local SDK that ./go.work points at; its
    # --version then names where the SDK came from. A release never does:
    # release-check refuses a set GOWORK.
    env:
      GOWORK:
        sh: if [ -f go.work ]; then echo "$(pwd)/go.work"; else echo off; fi
    cmd: go build -trimpath -ldflags "-s -w" -o {{.DIST}}/{{.BINARY}} ./cmd/secret

  release:
    desc: 'Check, pass the security gate and build every platform here, then tag HEAD as VERSION and push the tag, which starts the Release workflow: task release VERSION=v0.1.0'
    # VERSION reaches the shell as the environment variable RELEASE_VERSION,
    # never as command text. A variable the shell already exports wins over
    # env: here, so the name is one a shell is unlikely to have.
    requires:
      vars: [VERSION]
    env:
      RELEASE_VERSION: '{{.VERSION}}'
    preconditions:
      - sh: printf '%s' "$RELEASE_VERSION" | grep -Eq '{{.SEMVER}}'
        msg: 'VERSION must be vMAJOR.MINOR.PATCH, like v0.1.0'
      - sh: test -z "$(git ls-remote --tags origin "refs/tags/$RELEASE_VERSION")"
        msg: 'this version is already tagged on origin'
    cmds:
      - git fetch --quiet --tags origin main
      - task: release-check
      - task: security
      - task: release-snapshot
      - git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" >/dev/null || git tag -a "$RELEASE_VERSION" -m "secret $RELEASE_VERSION"
      - git push origin "refs/tags/$RELEASE_VERSION"

  release-check:
    desc: 'The checks a release must pass, run by task release before tagging and by the Release workflow on the tag: task release-check VERSION=v0.1.0'
    # It reads origin/main and the tags as they are here; task release
    # fetches them first, and the workflow checks out the full history.
    requires:
      vars: [VERSION]
    env:
      RELEASE_VERSION: '{{.VERSION}}'
    preconditions:
      - sh: printf '%s' "$RELEASE_VERSION" | grep -Eq '{{.SEMVER}}'
        msg: 'VERSION must be vMAJOR.MINOR.PATCH, like v0.1.0'
      - sh: test "$(go env GOWORK)" = off
        msg: 'GOWORK is set, so the build would not use the SDK version go.mod requires: unset it'
      - sh: '! grep -Eq "^[[:space:]]*replace([[:space:]]|\()" go.mod'
        msg: 'go.mod replaces a module: a release builds only from published module versions'
      - sh: awk '$1 == "{{.SDK}}" { print $2 }' go.mod | grep -Eq '{{.SEMVER}}'
        msg: 'go.mod must require an SDK release (vMAJOR.MINOR.PATCH), not a pseudo-version'
      - sh: go list -deps ./... >/dev/null 2>&1
        msg: 'the modules go.mod requires do not resolve (go list -deps ./... says why): publish the SDK release, then GOWORK=off go mod tidy'
      - sh: go mod tidy -diff >/dev/null
        msg: 'go.mod or go.sum is not tidy: run GOWORK=off go mod tidy and commit the result'
      - sh: test -z "$(git status --porcelain)"
        msg: 'the tree has uncommitted or untracked files: a release is a commit'
      - sh: git merge-base --is-ancestor HEAD origin/main
        msg: 'HEAD is not on origin/main: push it first'
      - sh: '! git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" >/dev/null || test "$(git rev-list -n 1 "refs/tags/$RELEASE_VERSION")" = "$(git rev-parse HEAD)"'
        msg: 'the tag for this version points at another commit'
      - sh: |
          last=$(git tag --list 'v*' | grep -E '{{.SEMVER}}' | grep -vxF "$RELEASE_VERSION" | sort -V | tail -n 1)
          test -z "$last" || test "$(printf '%s\n%s\n' "$last" "$RELEASE_VERSION" | sort -V | tail -n 1)" = "$RELEASE_VERSION"
        msg: 'VERSION is not newer than the last release'

  release-build:
    desc: 'Build the release for the tag VERSION at HEAD into dist/ (archives, SBOMs, SHA256SUMS, install.sh and install.ps1), as the Release workflow does: task release-build VERSION=v0.1.0'
    # GoReleaser refuses a dirty tree and a tag that is not at HEAD. It
    # publishes nothing: release.yml signs, attests and publishes dist/.
    requires:
      vars: [VERSION]
    deps: [release-tools]
    env:
      RELEASE_VERSION: '{{.VERSION}}'
    # Variables the shell already has win over env: here, so PATH and the
    # tag are set on the command itself. GoReleaser runs syft from PATH.
    cmds:
      - GORELEASER_CURRENT_TAG="$RELEASE_VERSION" PATH="{{.TASKFILE_DIR}}/{{.TOOLS}}:$PATH" goreleaser release --clean --skip=publish
      - cp scripts/install.sh scripts/install.ps1 {{.DIST}}/

  release-snapshot:
    desc: 'Build every release platform into dist/ as a dry run: binaries say "dev", nothing is signed or published'
    deps: [release-tools]
    cmds:
      - PATH="{{.TASKFILE_DIR}}/{{.TOOLS}}:$PATH" goreleaser release --snapshot --clean --skip=publish
      - cp scripts/install.sh scripts/install.ps1 {{.DIST}}/

  release-tools:
    internal: true
    # go install refuses two modules in one call, so one call each.
    cmds:
      - GOBIN="{{.TASKFILE_DIR}}/{{.TOOLS}}" go install {{.GORELEASER}}
      - GOBIN="{{.TASKFILE_DIR}}/{{.TOOLS}}" go install {{.SYFT}}
      - printf '%s\n' '{{.GORELEASER}} {{.SYFT}}' > {{.TOOLS}}/versions
    status:
      - test -x {{.TOOLS}}/goreleaser && test -x {{.TOOLS}}/syft
      - test "$(cat {{.TOOLS}}/versions 2>/dev/null)" = '{{.GORELEASER}} {{.SYFT}}'

  security:
    desc: 'Release gate: known vulnerabilities, gosec, disallowed licenses and secrets in git history (reports in reports/)'
    # The scans run in parallel; each one finishes and keeps its report
    # even when another fails, and the task fails if any of them did.
    # gitleaks takes its rules from .gitleaks.toml and its exceptions from
    # .gitleaksignore in the folder it scans, so a commit could switch off its
    # own scan. Both files are refused. --text and -m stop .gitattributes, NUL
    # bytes and merge commits hiding a change from git log. This catches
    # accidents and stray settings, not someone who can edit this file.
    # This repository cannot pass --ignore-gitleaks-allow: the gitleaks:allow
    # comment on the fake token in internal/login/login_test.go is in history,
    # which is scanned, so the flag would fail the scan for good.
    deps:
      - task: scan
        vars: {NAME: govulncheck, CMD: 'go run {{.GOVULNCHECK}} ./...'}
      - task: scan
        vars: {NAME: gosec, CMD: 'go run {{.GOSEC}} -nosec-require-justification -nosec-require-rules ./...'}
      - task: scan
        vars: {NAME: licenses, CMD: 'go run {{.OSV_SCANNER}} scan source --config=licenses.toml --licenses={{.LICENSES}} .'}
      - task: scan
        vars: {NAME: gitleaks-config, CMD: '{ test ! -e .gitleaks.toml && test ! -e .gitleaksignore || { echo "gitleaks would take its rules or exceptions from these files, so a commit could hide a leak. Remove .gitleaks.toml and .gitleaksignore."; false; }; }'}
      - task: scan
        vars: {NAME: gitleaks, CMD: 'go run {{.GITLEAKS}} git --no-banner --no-color --redact --verbose --log-opts="--all --text -m" .'}

  scan:
    internal: true
    # Runs CMD into REPORTS/NAME.txt and prints the report only on failure.
    cmds:
      - mkdir -p {{.REPORTS}}
      - '{{.CMD}} > {{.REPORTS}}/{{.NAME}}.txt 2>&1 || { cat {{.REPORTS}}/{{.NAME}}.txt; echo "{{.NAME}}: FAILED, report in {{.REPORTS}}/{{.NAME}}.txt"; exit 1; }'
      - 'echo "{{.NAME}}: passed"'
