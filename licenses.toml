# osv-scanner configuration for the license check in `task security`.
# The allowlist is LICENSES in Taskfile.yml. A package outside it fails
# the check unless it has a reviewed exception below, with its reason.

# This scan checks licenses only; govulncheck gates vulnerabilities.
[[PackageOverrides]]
ecosystem = "Go"
vulnerability.ignore = true
reason = "License check only. govulncheck gates vulnerabilities."

# Our own SDK. deps.dev has no license for a version until it indexes the
# published tag (v0.3.0 is not published yet); the license is the LICENSE
# file of github.com/deepsecret-io/deepsecret-go.
[[PackageOverrides]]
name = "github.com/deepsecret-io/deepsecret-go"
ecosystem = "Go"
license.override = ["Apache-2.0"]
reason = "First-party DeepSecret SDK, Apache-2.0 (LICENSE in github.com/deepsecret-io/deepsecret-go)."
