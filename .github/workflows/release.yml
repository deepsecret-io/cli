name: Release

# Pushing a vMAJOR.MINOR.PATCH tag releases that commit (RELEASING.md):
#   check     the tag and the tree: task release-check
#   test      the tests (ci.yml) and the security gate (security.yml)
#   build     every platform with GoReleaser, with a read-only token
#   publish   in the release environment: sign SHA256SUMS with Sigstore,
#             attest the build provenance, then publish one GitHub release
# The release stays a draft until everything is uploaded, so
# releases/latest/download/<name> never points at a partial release.
on:
  push:
    tags: ['v*.*.*']

permissions: {}

# One release at a time, never cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

env:
  # Modules come from go.mod and go.sum only, never from a go.work.
  GOWORK: 'off'
  GO_VERSION: 1.27.x
  TASK: github.com/go-task/task/v3/cmd/task@v3.54.0
  # The tag reaches the shell as an environment variable, never as command
  # text. release-check refuses anything but vMAJOR.MINOR.PATCH.
  VERSION: ${{ github.ref_name }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      go-version: ${{ steps.go.outputs.go-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # release-check compares with origin/main and the other tags
          persist-credentials: false
      # The latest Go patch release, resolved once: the tests, the scans
      # and the build all use this exact version.
      - id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false
      - name: Check that the Go version is exact
        env:
          GO_EXACT: ${{ steps.go.outputs.go-version }}
        run: printf '%s' "$GO_EXACT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'
      - run: go install "$TASK"
      - run: task release-check VERSION="$VERSION"

  test:
    name: test
    needs: check
    permissions:
      contents: read
      pull-requests: read # ci.yml's lint job declares it; lint is skipped on a tag
    uses: ./.github/workflows/ci.yml
    with:
      go-version: ${{ needs.check.outputs.go-version }}

  security:
    name: security
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml
    with:
      go-version: ${{ needs.check.outputs.go-version }}

  build:
    name: build
    needs: [check, test, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # GoReleaser reads the tag and the commit date
          persist-credentials: false
      # No module or build cache: a release builds from what go.sum names.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.check.outputs.go-version }}
          cache: false
      - run: go install "$TASK"
      - run: task release-build VERSION="$VERSION"
      # The landing page, install.sh and RELEASING.md link to these names.
      - name: Check the published names
        working-directory: dist
        run: |
          for name in secret_darwin_amd64.tar.gz secret_darwin_arm64.tar.gz \
            secret_linux_amd64.tar.gz secret_linux_arm64.tar.gz \
            secret_linux_amd64_fido2.tar.gz secret_linux_arm64_fido2.tar.gz \
            secret_windows_amd64.zip secret_windows_arm64.zip; do
            test -f "$name" && test -f "$name.spdx.json" || { echo "missing $name"; exit 1; }
          done
          test -f install.sh && test -f SHA256SUMS
      - name: Record what was built
        working-directory: dist
        run: |
          cat SHA256SUMS
          go version -m ./*/secret ./*/secret.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.spdx.json
            dist/install.sh
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30 # the release environment may wait for approval

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # the release and its files
      id-token: write # Sigstore keyless signing and the attestation
      attestations: write # the build provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-reports
          path: security-reports
      # Every file is listed in SHA256SUMS and matches it, so nothing
      # unsigned is published.
      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: |
          sha256sum --strict --check SHA256SUMS
          test "$(ls | grep -vxF SHA256SUMS | sort)" = "$(awk '{ print $2 }' SHA256SUMS | sort)"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4
      # Keyless: the certificate names this workflow at this tag, and the
      # signature is logged in Sigstore's public transparency log.
      - name: Sign SHA256SUMS
        working-directory: dist
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Check the attestations
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '{ print $2 }' SHA256SUMS | while read -r f; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
      # The scan reports stay with the release as evidence; workflow
      # artifacts expire.
      - name: Pack the security reports
        run: tar -czf security-reports.tar.gz -C security-reports .
      - name: Write the release notes
        run: |
          {
            echo "Check a download before you run it. RELEASING.md in the repository explains each step."
            echo
            echo '```sh'
            echo "sha256sum --check --ignore-missing SHA256SUMS   # macOS: shasum -a 256 --check --ignore-missing SHA256SUMS"
            echo "cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \\"
            echo "  --certificate-identity $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify secret_linux_amd64.tar.gz --repo $GITHUB_REPOSITORY"
            echo '```'
            echo
            echo "secret_linux_<arch>.tar.gz is fully static and runs on any Linux, without security key support. secret_linux_<arch>_fido2.tar.gz adds security keys (YubiKey) and needs glibc and libfido2. secret_windows_<arch>.zip runs on Windows, without security key support; check it in PowerShell with Get-FileHash and compare the hash with its line in SHA256SUMS."
          } > notes.md
      # A draft left by a failed attempt is replaced; a published release
      # is never changed.
      - name: Create the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true || { echo "$VERSION is already published"; exit 1; }
            gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "secret $VERSION" --generate-notes --notes-file notes.md \
            dist/* security-reports.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
